[workspace]
resolver = "2"
members = ["crates/sparkline-core", "crates/sparkline"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
sparkline-core = { path = "crates/sparkline-core" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tonic = { version = "0.12", features = ["tls", "tls-native-roots"] }
tonic-types = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
protox = "0.7"
arrow-array = "54"
arrow-schema = "54"
arrow-cast = "54"
arrow-ipc = { version = "54", features = ["lz4", "zstd"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

reedline = "0.38"
nu-ansi-term = "0.50"
comfy-table = { version = "7", features = ["custom_styling"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
