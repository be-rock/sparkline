name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: make lint
      - run: make test

  live:
    name: Tests against Spark Connect 4.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
      - uses: Swatinem/rust-cache@v2
      - name: Protocol tests
        run: make test-live
      - name: Interactive (pty) tests
        run: make test-tui
      - name: Spark server log
        if: failure()
        run: tail -200 .spark-dev/server.log || true
